[package]
name = "spektrafilm-io"
version.workspace = true
edition.workspace = true
license.workspace = true

# HarmonyOS port: `apple-raw` is removed from the default set. It is a macOS
# Objective-C bridge to CoreImage's RAW decoder; the portable RAW path is the
# vendored pure-Rust `rawler`, which is what we cross-compile.
[features]
default = []
apple-raw = []
precision-f64 = ["spektrafilm-math/precision-f64"]

[dependencies]
spektrafilm-math.workspace = true
image.workspace = true
anyhow.workspace = true
rayon.workspace = true
web-time.workspace = true
serde.workspace = true
serde_json.workspace = true
rawler = "0.8"
ab_glyph = "0.2.32"

[build-dependencies]
cc = "1"
